<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一个面向 HTML PPT 和单页作品的可视化源码编辑器：导入、预览、选中元素、微调样式并导出干净 HTML。"
    />
    <title>HTML Studio 可视化编辑器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="HTML Studio">
          <span class="brand-mark" aria-hidden="true">H</span>
          <div>
            <h1>HTML Studio</h1>
            <p>点击画布元素，微调内容与样式，导出干净 HTML</p>
          </div>
        </div>

        <div class="developer-strip" aria-label="开发者信息">
          <span class="developer-label">公众号</span>
          <strong>科技小亮AGI</strong>
          <a
            class="github-link"
            href="https://github.com/kejixiaoliang"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub 主页
          </a>
        </div>

        <div class="toolbar" aria-label="项目操作">
          <span id="sourceStatus" class="status-pill">已同步</span>
          <label class="button secondary">
            上传 HTML
            <input id="fileInput" type="file" accept=".html,.htm,text/html" />
          </label>
          <button id="loadSampleBtn" class="button secondary" type="button">示例</button>
          <button id="refreshBtn" class="icon-button" type="button" title="刷新渲染" aria-label="刷新渲染">↻</button>
          <button id="undoBtn" class="icon-button" type="button" title="撤销" aria-label="撤销">↶</button>
          <button id="redoBtn" class="icon-button" type="button" title="重做" aria-label="重做">↷</button>
          <button id="downloadBtn" class="button primary" type="button">
            <span aria-hidden="true">↓</span>
            导出 HTML
          </button>
        </div>
      </header>

      <div id="draftBar" class="draft-bar hidden" role="status">
        <div>
          <strong>发现本地草稿</strong>
          <span id="draftInfo">可以恢复上次未导出的编辑内容。</span>
        </div>
        <div class="draft-actions">
          <button id="restoreDraftBtn" class="text-button" type="button">恢复草稿</button>
          <button id="discardDraftBtn" class="text-button" type="button">放弃</button>
        </div>
      </div>

      <main id="workspace" class="workspace source-collapsed">
        <section class="panel source-panel" aria-label="源码编辑区">
          <button id="sourceRailBtn" class="source-rail-button" type="button" aria-label="展开源码" title="展开源码">
            <span aria-hidden="true">›</span>
            源码
          </button>
          <div class="panel-header">
            <div class="panel-title">
              <strong>源码</strong>
              <span id="sourceSelectionInfo">未选中元素</span>
            </div>
            <div class="panel-actions">
              <button id="locateSourceBtn" class="text-button" type="button" disabled>定位</button>
              <button id="sourceToggleBtn" class="icon-button" type="button" aria-label="展开源码" title="展开源码">
                ≡
              </button>
            </div>
          </div>
          <div class="source-wrap">
            <textarea id="sourceEditor" spellcheck="false" aria-label="HTML 源码"></textarea>
          </div>
        </section>

        <section class="panel preview-panel" aria-label="预览画布">
          <div class="panel-header preview-header">
            <div>
              <strong>画布</strong>
              <span id="selectionLabel">点击页面元素进行编辑</span>
            </div>

            <div class="preview-tools" aria-label="画布控制">
              <div class="segmented" aria-label="画布比例">
                <button class="segment is-active" type="button" data-canvas-mode="16:9">16:9</button>
                <button class="segment" type="button" data-canvas-mode="4:3">4:3</button>
                <button class="segment" type="button" data-canvas-mode="adaptive">自适应</button>
              </div>
              <div class="segmented" aria-label="缩放">
                <button class="segment is-active" type="button" data-zoom-mode="fit">Fit</button>
                <button class="segment" type="button" data-zoom-mode="0.75">75%</button>
                <button class="segment" type="button" data-zoom-mode="1">100%</button>
                <button class="segment" type="button" data-zoom-mode="1.25">125%</button>
              </div>
              <button id="selectParentBtn" class="text-button" type="button" disabled>选父级</button>
              <button id="clearSelectionBtn" class="text-button" type="button" disabled>取消</button>
            </div>
          </div>

          <div id="previewStage" class="preview-stage">
            <div id="canvasShell" class="canvas-shell">
              <div id="slideViewport" class="slide-viewport">
                <iframe
                  id="previewFrame"
                  title="HTML preview"
                  sandbox="allow-scripts allow-same-origin"
                ></iframe>
              </div>
            </div>
            <div id="floatingToolbar" class="floating-toolbar hidden" aria-label="快捷编辑工具">
              <span id="toolbarSelectionLabel" class="toolbar-chip">body</span>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <span class="toolbar-group" aria-label="文字格式">
                <button class="quick-button" type="button" data-quick-action="bold" title="加粗">B</button>
                <button class="quick-button" type="button" data-quick-action="italic" title="斜体">I</button>
                <button class="quick-button" type="button" data-quick-action="underline" title="下划线">U</button>
                <button class="quick-button" type="button" data-quick-action="strike" title="删除线">S</button>
              </span>
              <span class="toolbar-group" aria-label="字号">
                <button class="quick-button" type="button" data-quick-action="font-down" title="字号减小">A-</button>
                <button class="quick-button" type="button" data-quick-action="font-up" title="字号增大">A+</button>
              </span>
              <span class="toolbar-group" aria-label="对齐">
                <button class="quick-button" type="button" data-quick-action="align-left" title="左对齐">左</button>
                <button class="quick-button" type="button" data-quick-action="align-center" title="居中">中</button>
                <button class="quick-button" type="button" data-quick-action="align-right" title="右对齐">右</button>
              </span>
              <span class="toolbar-group" aria-label="颜色">
                <button class="quick-swatch swatch-accent" type="button" data-quick-action="accent-color" title="强调文字"></button>
                <button class="quick-swatch swatch-soft" type="button" data-quick-action="soft-background" title="柔和底色"></button>
              </span>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <span class="toolbar-group" aria-label="样式操作">
                <button class="quick-button quick-text" type="button" data-quick-action="copy-style" title="复制当前元素的行内样式">复制</button>
                <button class="quick-button quick-text" type="button" data-quick-action="paste-style" title="粘贴已复制的行内样式">粘贴</button>
                <button class="quick-button quick-text" type="button" data-quick-action="clear-style" title="清除当前元素的行内样式">清除</button>
              </span>
            </div>
          </div>

          <div class="panel-footer breadcrumb-row">
            <span id="canvasInfo">16:9 · Fit</span>
            <code id="breadcrumbBar">body</code>
          </div>
        </section>

        <aside class="panel inspector-panel" aria-label="属性编辑区">
          <div class="panel-header">
            <div>
              <strong>属性</strong>
              <span id="inspectorHint">先在画布中选择元素</span>
            </div>
          </div>

          <div id="emptyInspector" class="empty-state">
            <div class="empty-icon" aria-hidden="true">⌖</div>
            <h2>选择画布里的任意元素</h2>
            <p>标题、段落、图片、按钮、卡片都可以直接点击。选中后可修改文本、图片地址、颜色、间距、尺寸和阴影。</p>
          </div>

          <form id="inspectorForm" class="inspector-form hidden">
            <section class="card selected-card">
              <div id="selectedSummary" class="selected-summary">未选中</div>
              <div class="field-grid">
                <label>
                  标签
                  <input id="tagNameInput" type="text" disabled />
                </label>
                <label>
                  尺寸
                  <input id="elementSizeInput" type="text" disabled />
                </label>
              </div>
            </section>

            <section class="card">
              <div class="card-title">选区</div>
              <div id="ancestorList" class="chip-list"></div>
              <div id="childrenList" class="chip-list"></div>
            </section>

            <section class="card">
              <div class="card-title">内容</div>
              <label>
                文本内容
                <textarea id="textInput" rows="4"></textarea>
              </label>
              <label id="srcField" class="hidden">
                图片/媒体地址 src
                <input id="srcInput" type="text" />
              </label>
              <label id="hrefField" class="hidden">
                链接地址 href
                <input id="hrefInput" type="text" />
              </label>
            </section>

            <details class="card advanced-card">
              <summary class="card-title">标识</summary>
              <label>
                id
                <input id="idInput" type="text" />
              </label>
              <label>
                class
                <input id="classInput" type="text" />
              </label>
            </details>

            <section class="card">
              <div class="card-title">文字</div>
              <div class="format-toolbar" aria-label="文字格式">
                <button id="italicBtn" class="format-button" type="button" aria-pressed="false" title="斜体">I</button>
                <button id="underlineBtn" class="format-button" type="button" aria-pressed="false" title="下划线">U</button>
                <button id="strikeBtn" class="format-button" type="button" aria-pressed="false" title="删除线">S</button>
              </div>
              <div class="field-grid">
                <label>
                  文字颜色
                  <input id="colorInput" type="color" />
                </label>
                <label>
                  字号
                  <input id="fontSizeInput" type="text" placeholder="48px" />
                </label>
              </div>
              <label>
                字重
                <select id="fontWeightInput">
                  <option value="">默认</option>
                  <option value="300">300</option>
                  <option value="400">400</option>
                  <option value="500">500</option>
                  <option value="600">600</option>
                  <option value="700">700</option>
                  <option value="800">800</option>
                </select>
              </label>
              <div class="field-grid">
                <label>
                  对齐
                  <select id="textAlignInput">
                    <option value="">默认</option>
                    <option value="left">左对齐</option>
                    <option value="center">居中</option>
                    <option value="right">右对齐</option>
                    <option value="justify">两端对齐</option>
                  </select>
                </label>
                <label>
                  行高
                  <input id="lineHeightInput" type="text" placeholder="1.5 / 36px" />
                </label>
              </div>
              <div class="field-grid">
                <label>
                  字体
                  <input id="fontFamilyInput" type="text" placeholder='Microsoft YaHei' />
                </label>
                <label>
                  字间距
                  <input id="letterSpacingInput" type="text" placeholder="0.04em / 2px" />
                </label>
              </div>
            </section>

            <section class="card">
              <div class="card-title">背景与外观</div>
              <div class="field-grid">
                <label>
                  背景色
                  <input id="backgroundInput" type="color" />
                </label>
                <label>
                  圆角
                  <input id="borderRadiusInput" type="text" placeholder="12px" />
                </label>
              </div>
              <label>
                阴影
                <input id="boxShadowInput" type="text" placeholder="0 12px 30px rgba(0,0,0,.16)" />
              </label>
              <label>
                透明度
                <input id="opacityInput" type="text" placeholder="0.8" />
              </label>
            </section>

            <details class="card advanced-card">
              <summary class="card-title">高级布局</summary>
              <div class="field-grid">
                <label>
                  宽度
                  <input id="widthInput" type="text" placeholder="320px / 100%" />
                </label>
                <label>
                  高度
                  <input id="heightInput" type="text" placeholder="auto / 240px" />
                </label>
              </div>
              <div class="field-grid">
                <label>
                  外边距
                  <input id="marginInput" type="text" placeholder="16px" />
                </label>
                <label>
                  内边距
                  <input id="paddingInput" type="text" placeholder="24px" />
                </label>
              </div>
              <label>
                transform
                <input id="transformInput" type="text" placeholder="translateY(-4px)" />
              </label>
            </details>

            <details class="card advanced-card">
              <summary class="card-title">源码与标识</summary>
              <label>
                源码位置
                <input id="sourceRangeInput" type="text" disabled />
              </label>
              <label>
                元素路径
                <input id="elementPathInput" type="text" disabled />
              </label>
            </details>
          </form>
        </aside>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
