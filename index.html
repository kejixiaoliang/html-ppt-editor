<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML 可视化源码编辑器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">H</span>
          <div>
            <h1>HTML 可视化源码编辑器</h1>
            <p>左侧源码，中间渲染，右侧编辑；选中元素后自动定位源码</p>
          </div>
        </div>

        <div class="toolbar">
          <label class="button secondary">
            上传 HTML
            <input id="fileInput" type="file" accept=".html,.htm,text/html" />
          </label>
          <button id="loadSampleBtn" class="button secondary" type="button">载入示例</button>
          <button id="refreshBtn" class="button secondary" type="button">刷新渲染</button>
          <button id="undoBtn" class="button secondary" type="button">撤销</button>
          <button id="redoBtn" class="button secondary" type="button">重做</button>
          <button id="downloadBtn" class="button primary" type="button">导出 HTML</button>
        </div>
      </header>

      <main class="workspace">
        <section class="panel source-panel">
          <div class="panel-header">
            <div>
              <strong>源码</strong>
              <span id="sourceStatus">已同步</span>
            </div>
            <button id="locateSourceBtn" class="text-button" type="button" disabled>定位选中</button>
          </div>
          <div class="source-wrap">
            <textarea id="sourceEditor" spellcheck="false"></textarea>
          </div>
          <div class="panel-footer">
            <span id="sourceSelectionInfo">未选中元素</span>
          </div>
        </section>

        <section class="panel preview-panel">
          <div class="panel-header">
            <div>
              <strong>HTML 渲染</strong>
              <span id="selectionLabel">点击页面元素进行编辑</span>
            </div>
            <div class="preview-actions">
              <button id="selectParentBtn" class="text-button" type="button" disabled>选父级</button>
              <button id="clearSelectionBtn" class="text-button" type="button" disabled>取消选择</button>
            </div>
          </div>

          <div class="preview-frame-wrap">
            <iframe
              id="previewFrame"
              title="HTML preview"
              sandbox="allow-scripts allow-same-origin"
            ></iframe>
          </div>

          <div class="panel-footer breadcrumb-row">
            <span>层级路径</span>
            <code id="breadcrumbBar">body</code>
          </div>
        </section>

        <aside class="panel inspector-panel">
          <div class="panel-header">
            <div>
              <strong>编辑</strong>
              <span id="inspectorHint">先在渲染区选择元素</span>
            </div>
          </div>

          <div id="emptyInspector" class="empty-state">
            <h2>请选择一个元素</h2>
            <p>文字、背景、容器、图片等都可以直接点击。选中后源码会自动滚动并高亮对应片段。</p>
          </div>

          <form id="inspectorForm" class="inspector-form hidden">
            <section class="card selected-card">
              <div id="selectedSummary" class="selected-summary">未选中</div>
              <div class="field-grid">
                <label>
                  标签
                  <input id="tagNameInput" type="text" disabled />
                </label>
                <label>
                  尺寸
                  <input id="elementSizeInput" type="text" disabled />
                </label>
              </div>
              <label>
                源码位置
                <input id="sourceRangeInput" type="text" disabled />
              </label>
              <label>
                元素路径
                <input id="elementPathInput" type="text" disabled />
              </label>
            </section>

            <section class="card">
              <div class="card-title">层级选择</div>
              <div id="ancestorList" class="chip-list"></div>
              <div id="childrenList" class="chip-list"></div>
            </section>

            <section class="card">
              <div class="card-title">内容</div>
              <label>
                文本内容
                <textarea id="textInput" rows="4"></textarea>
              </label>
              <label id="srcField" class="hidden">
                图片/媒体地址 src
                <input id="srcInput" type="text" />
              </label>
              <label id="hrefField" class="hidden">
                链接地址 href
                <input id="hrefInput" type="text" />
              </label>
            </section>

            <section class="card">
              <div class="card-title">标识</div>
              <label>
                id
                <input id="idInput" type="text" />
              </label>
              <label>
                class
                <input id="classInput" type="text" />
              </label>
            </section>

            <section class="card">
              <div class="card-title">文字</div>
              <div class="field-grid">
                <label>
                  文字颜色
                  <input id="colorInput" type="color" />
                </label>
                <label>
                  字号
                  <input id="fontSizeInput" type="text" placeholder="48px" />
                </label>
              </div>
              <label>
                字重
                <select id="fontWeightInput">
                  <option value="">默认</option>
                  <option value="300">300</option>
                  <option value="400">400</option>
                  <option value="500">500</option>
                  <option value="600">600</option>
                  <option value="700">700</option>
                  <option value="800">800</option>
                </select>
              </label>
            </section>

            <section class="card">
              <div class="card-title">背景与外观</div>
              <div class="field-grid">
                <label>
                  背景色
                  <input id="backgroundInput" type="color" />
                </label>
                <label>
                  圆角
                  <input id="borderRadiusInput" type="text" placeholder="12px" />
                </label>
              </div>
              <label>
                阴影
                <input id="boxShadowInput" type="text" placeholder="0 12px 30px rgba(0,0,0,.16)" />
              </label>
              <label>
                透明度
                <input id="opacityInput" type="text" placeholder="0.8" />
              </label>
            </section>

            <section class="card">
              <div class="card-title">尺寸与间距</div>
              <div class="field-grid">
                <label>
                  宽度
                  <input id="widthInput" type="text" placeholder="320px / 100%" />
                </label>
                <label>
                  高度
                  <input id="heightInput" type="text" placeholder="auto / 240px" />
                </label>
              </div>
              <div class="field-grid">
                <label>
                  外边距
                  <input id="marginInput" type="text" placeholder="16px" />
                </label>
                <label>
                  内边距
                  <input id="paddingInput" type="text" placeholder="24px" />
                </label>
              </div>
              <label>
                transform
                <input id="transformInput" type="text" placeholder="translateY(-4px)" />
              </label>
            </section>
          </form>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
